<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0a0604"/>
    </radialGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d4af37" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.4"/>

  <!-- 생명의 꽃: 19개 원이 육각 격자로 겹침 -->
  <g transform="translate(50 80)" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.85">
    <!-- 중앙 원 -->
    <circle r="14"/>
    <!-- 1차 6개 (육각으로 인접) -->
    <circle cx="14" cy="0" r="14"/>
    <circle cx="-14" cy="0" r="14"/>
    <circle cx="7" cy="-12.124" r="14"/>
    <circle cx="-7" cy="-12.124" r="14"/>
    <circle cx="7" cy="12.124" r="14"/>
    <circle cx="-7" cy="12.124" r="14"/>
    <!-- 2차 12개 (외곽) -->
    <g opacity="0.7">
      <circle cx="28" cy="0" r="14"/>
      <circle cx="-28" cy="0" r="14"/>
      <circle cx="14" cy="-24.249" r="14"/>
      <circle cx="-14" cy="-24.249" r="14"/>
      <circle cx="14" cy="24.249" r="14"/>
      <circle cx="-14" cy="24.249" r="14"/>
      <circle cx="21" cy="-12.124" r="14"/>
      <circle cx="-21" cy="-12.124" r="14"/>
      <circle cx="21" cy="12.124" r="14"/>
      <circle cx="-21" cy="12.124" r="14"/>
      <circle cx="0" cy="-24.249" r="14"/>
      <circle cx="0" cy="24.249" r="14"/>
    </g>
  </g>

  <!-- 외접 원 (전체 감싸기) -->
  <circle cx="50" cy="80" r="42" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
  <circle cx="50" cy="80" r="44" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.4"/>
</svg>
