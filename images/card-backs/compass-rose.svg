<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1c1408"/>
      <stop offset="1" stop-color="#0c0804"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#caa84a" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#caa84a" stroke-width="0.3" opacity="0.5"/>

  <!-- 외곽 원 (방위 표시) -->
  <g transform="translate(50 80)">
    <circle r="36" fill="none" stroke="#caa84a" stroke-width="0.5" opacity="0.6"/>
    <circle r="32" fill="none" stroke="#caa84a" stroke-width="0.3" opacity="0.4"/>

    <!-- 방위 눈금 16개 -->
    <g stroke="#caa84a" stroke-width="0.4" opacity="0.7">
      <line x1="0" y1="-36" x2="0" y2="-32"/>
      <line x1="0" y1="36" x2="0" y2="32"/>
      <line x1="-36" y1="0" x2="-32" y2="0"/>
      <line x1="36" y1="0" x2="32" y2="0"/>
    </g>
    <g stroke="#caa84a" stroke-width="0.3" opacity="0.5">
      <line x1="25.46" y1="-25.46" x2="22.63" y2="-22.63"/>
      <line x1="-25.46" y1="-25.46" x2="-22.63" y2="-22.63"/>
      <line x1="25.46" y1="25.46" x2="22.63" y2="22.63"/>
      <line x1="-25.46" y1="25.46" x2="-22.63" y2="22.63"/>
    </g>

    <!-- 큰 4방위 별 (다이아몬드형) -->
    <g fill="#caa84a">
      <!-- 북 (위) -->
      <path d="M0 -32 L4 -8 L0 0 L-4 -8 Z" opacity="0.95"/>
      <!-- 남 (아래) -->
      <path d="M0 32 L-4 8 L0 0 L4 8 Z" opacity="0.7"/>
      <!-- 동 (오른쪽) -->
      <path d="M32 0 L8 4 L0 0 L8 -4 Z" opacity="0.8"/>
      <!-- 서 (왼쪽) -->
      <path d="M-32 0 L-8 -4 L0 0 L-8 4 Z" opacity="0.8"/>
    </g>

    <!-- 작은 대각 4방위 -->
    <g fill="#8a7220" opacity="0.85">
      <path d="M22.63 -22.63 L4 -4 L0 0 L-4 4 L-22.63 22.63 Z" transform="rotate(-45)"/>
      <path d="M22.63 -22.63 L4 -4 L0 0 L-4 4 L-22.63 22.63 Z" transform="rotate(45)"/>
      <path d="M22.63 -22.63 L4 -4 L0 0 L-4 4 L-22.63 22.63 Z" transform="rotate(135)"/>
      <path d="M22.63 -22.63 L4 -4 L0 0 L-4 4 L-22.63 22.63 Z" transform="rotate(-135)"/>
    </g>

    <!-- 중심 원 -->
    <circle r="3" fill="#caa84a"/>
    <circle r="1.4" fill="#0c0804"/>

    <!-- N 표시 -->
    <text x="0" y="-40" text-anchor="middle" fill="#caa84a" font-family="serif" font-size="6" font-weight="bold" opacity="0.9">N</text>
  </g>

  <!-- 하단 작은 별 -->
  <g transform="translate(50 138)" fill="#caa84a" opacity="0.6">
    <path d="M0 -3 L0.8 -0.8 L3 0 L0.8 0.8 L0 3 L-0.8 0.8 L-3 0 L-0.8 -0.8 Z"/>
  </g>
</svg>
