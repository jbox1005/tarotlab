<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="scg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0c0804"/>
    </linearGradient>
    <linearGradient id="scbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8870"/>
      <stop offset="1" stop-color="#1e5a48"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#scg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d8a848" stroke-width="0.6"/>

  <!-- 태양 원반 (Ra) -->
  <circle cx="50" cy="38" r="10" fill="#e8b04c"/>
  <circle cx="50" cy="38" r="10" fill="none" stroke="#d8a848" stroke-width="0.6"/>
  <!-- 태양 광선 -->
  <g stroke="#d8a848" stroke-width="0.6" opacity="0.6">
    <line x1="50" y1="22" x2="50" y2="26"/>
    <line x1="64" y1="32" x2="62" y2="34"/>
    <line x1="36" y1="32" x2="38" y2="34"/>
    <line x1="50" y1="50" x2="50" y2="54"/>
  </g>

  <!-- 풍뎅이 (Khepri) -->
  <g transform="translate(50, 80)">
    <!-- 날개 (펼친) -->
    <g fill="url(#scbody)" stroke="#d8a848" stroke-width="0.4">
      <ellipse cx="-22" cy="0" rx="20" ry="9" transform="rotate(-15 -22 0)"/>
      <ellipse cx="22" cy="0" rx="20" ry="9" transform="rotate(15 22 0)"/>
    </g>
    <!-- 날개 무늬 -->
    <g stroke="#d8a848" stroke-width="0.3" fill="none" opacity="0.7">
      <line x1="-38" y1="-2" x2="-12" y2="0"/>
      <line x1="-38" y1="2" x2="-12" y2="2"/>
      <line x1="-32" y1="-6" x2="-14" y2="-2"/>
      <line x1="38" y1="-2" x2="12" y2="0"/>
      <line x1="38" y1="2" x2="12" y2="2"/>
      <line x1="32" y1="-6" x2="14" y2="-2"/>
    </g>
    <!-- 몸통 -->
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="#1e5a48" stroke="#d8a848" stroke-width="0.6"/>
    <!-- 등 가운데 줄 -->
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#d8a848" stroke-width="0.4"/>
    <!-- 머리 -->
    <ellipse cx="0" cy="-15" rx="4.5" ry="3" fill="#1e5a48" stroke="#d8a848" stroke-width="0.5"/>
    <!-- 더듬이 -->
    <path d="M-3 -16 Q-7 -20 -10 -22" stroke="#d8a848" stroke-width="0.5" fill="none"/>
    <path d="M3 -16 Q7 -20 10 -22" stroke="#d8a848" stroke-width="0.5" fill="none"/>
    <!-- 다리 6개 -->
    <g stroke="#1e5a48" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M-4 -8 Q-12 -10 -14 -14"/>
      <path d="M4 -8 Q12 -10 14 -14"/>
      <path d="M-5 0 Q-14 0 -18 -2"/>
      <path d="M5 0 Q14 0 18 -2"/>
      <path d="M-4 8 Q-12 12 -14 14"/>
      <path d="M4 8 Q12 12 14 14"/>
    </g>
    <!-- 다리 끝 황금 -->
    <g fill="#d8a848">
      <circle cx="-14" cy="-14" r="0.8"/>
      <circle cx="14" cy="-14" r="0.8"/>
      <circle cx="-18" cy="-2" r="0.8"/>
      <circle cx="18" cy="-2" r="0.8"/>
      <circle cx="-14" cy="14" r="0.8"/>
      <circle cx="14" cy="14" r="0.8"/>
    </g>
  </g>

  <!-- 하단 앙크 (Ankh) -->
  <g transform="translate(50, 132)" stroke="#d8a848" stroke-width="1" fill="none">
    <ellipse cx="0" cy="-6" rx="4" ry="5"/>
    <line x1="0" y1="-1" x2="0" y2="10"/>
    <line x1="-5" y1="2" x2="5" y2="2"/>
  </g>

  <!-- 모서리 상형 점 -->
  <g fill="#d8a848" opacity="0.6">
    <circle cx="14" cy="14" r="0.6"/>
    <circle cx="86" cy="14" r="0.6"/>
    <circle cx="14" cy="146" r="0.6"/>
    <circle cx="86" cy="146" r="0.6"/>
  </g>
</svg>
