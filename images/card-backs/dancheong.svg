<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 단청 와운(渦雲) 컬 — 콤마 모양 소용돌이 -->
    <symbol id="whorl" viewBox="-10 -10 20 20">
      <path d="M0 -8 Q-7 -8 -7 -1 Q-7 5 -1 5 Q4 5 4 0 Q4 -3 1 -3 Q-1 -3 -1 -1"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>

    <!-- 와운 한 쌍 (반사 대칭) -->
    <symbol id="whorl-pair" viewBox="-12 -10 24 20">
      <use href="#whorl" x="-12" y="-10" width="11" height="20"/>
      <use href="#whorl" x="1" y="-10" width="11" height="20" transform="translate(12 0) scale(-1 1)"/>
    </symbol>

    <!-- 코너 큰 소용돌이 — 적색 외곽 + 청색 내곽 -->
    <symbol id="corner-orn" viewBox="0 0 30 30">
      <!-- 적색 외곽 곡선 (역방향 G자) -->
      <path d="M2 28 Q2 4 26 4 Q28 4 28 6 Q28 22 12 22 Q8 22 8 18 Q8 14 12 14 Q14 14 14 16"
            fill="none" stroke="#8a2828" stroke-width="3.2" stroke-linecap="round"/>
      <!-- 적색 곡선 옆 황색 -->
      <path d="M2 28 Q2 4 26 4" fill="none" stroke="#f0c040" stroke-width="0.6" opacity="0.9"/>
      <!-- 청색 안쪽 곡선 -->
      <path d="M6 24 Q6 8 22 8 Q26 8 26 12 Q26 18 16 18"
            fill="none" stroke="#5990c0" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 청색 끝 점 -->
      <circle cx="16" cy="18" r="1.4" fill="#5990c0"/>
      <!-- 적색 끝 점 -->
      <circle cx="14" cy="16" r="0.8" fill="#f0c040"/>
    </symbol>

    <!-- 마룬 잎사귀 윙 -->
    <symbol id="wing" viewBox="-14 -7 28 14">
      <path d="M-14 0 Q-12 -5 -6 -6 Q4 -6 10 -3 Q14 0 10 3 Q4 6 -6 6 Q-12 5 -14 0 Z"
            fill="#6e2828" stroke="#3a1414" stroke-width="0.6"/>
      <path d="M-11 0 Q-7 -3 -2 -3 Q3 -3 7 -1" stroke="#c84838" stroke-width="0.6" fill="none"/>
      <circle cx="-11" cy="0" r="0.9" fill="#f0c040"/>
    </symbol>

    <!-- 중앙 화판 와엽(여러 컬 한 묶음) -->
    <symbol id="medallion-curls" viewBox="-22 -22 44 44">
      <!-- 8방향 큰 컬 -->
      <g stroke="#7ab088" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M0 -20 Q-7 -16 -6 -10 Q-3 -8 -1 -10"/>
        <path d="M0 -20 Q7 -16 6 -10 Q3 -8 1 -10" />
        <path d="M14 -14 Q12 -7 6 -8" transform="rotate(0)"/>
        <path d="M-14 -14 Q-12 -7 -6 -8" transform="rotate(0)"/>
        <path d="M20 0 Q14 -3 12 4 Q12 8 14 8"/>
        <path d="M-20 0 Q-14 -3 -12 4 Q-12 8 -14 8"/>
        <path d="M14 14 Q12 7 6 8 Q4 10 6 12"/>
        <path d="M-14 14 Q-12 7 -6 8 Q-4 10 -6 12"/>
        <path d="M0 20 Q-7 16 -6 10 Q-3 8 -1 10"/>
        <path d="M0 20 Q7 16 6 10 Q3 8 1 10" />
      </g>
      <!-- 작은 컬 -->
      <g stroke="#a8d4b0" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M0 -14 Q-4 -12 -4 -8 Q-2 -6 0 -8"/>
        <path d="M0 -14 Q4 -12 4 -8 Q2 -6 0 -8"/>
        <path d="M0 14 Q-4 12 -4 8 Q-2 6 0 8"/>
        <path d="M0 14 Q4 12 4 8 Q2 6 0 8"/>
        <path d="M14 0 Q12 -4 8 -4 Q6 -2 8 0"/>
        <path d="M14 0 Q12 4 8 4 Q6 2 8 0"/>
        <path d="M-14 0 Q-12 -4 -8 -4 Q-6 -2 -8 0"/>
        <path d="M-14 0 Q-12 4 -8 4 Q-6 2 -8 0"/>
      </g>
    </symbol>
  </defs>

  <!-- ===== 베이스 (양록) ===== -->
  <rect width="100" height="160" fill="#3a7848"/>

  <!-- ===== 외곽 가장자리 ===== -->
  <rect x="2" y="2" width="96" height="156" rx="2" fill="none" stroke="#1a4828" stroke-width="1.2"/>
  <rect x="3.5" y="3.5" width="93" height="153" rx="1.5" fill="none" stroke="#f0c040" stroke-width="0.5"/>

  <!-- ===== 4 모서리 큰 소용돌이 ===== -->
  <use href="#corner-orn" x="5" y="5" width="30" height="30"/>
  <use href="#corner-orn" x="65" y="5" width="30" height="30" transform="translate(160 0) scale(-1 1)"/>
  <use href="#corner-orn" x="5" y="125" width="30" height="30" transform="translate(0 280) scale(1 -1)"/>
  <use href="#corner-orn" x="65" y="125" width="30" height="30" transform="translate(160 280) scale(-1 -1)"/>

  <!-- ===== 중앙 메달리온 — 다층 동심 타원 ===== -->
  <g transform="translate(50, 80)">
    <!-- 1) 외곽 진녹 -->
    <ellipse rx="42" ry="48" fill="#1a4828"/>
    <!-- 2) 양록 -->
    <ellipse rx="38" ry="44" fill="#5fa872"/>
    <!-- 3) 진녹 띠 -->
    <ellipse rx="35" ry="41" fill="#1a4828"/>
    <!-- 4) 군청 (파랑) 띠 -->
    <ellipse rx="32" ry="38" fill="#2a4488"/>
    <!-- 5) 자황 (노랑) 띠 -->
    <ellipse rx="29" ry="35" fill="#f0c040"/>
    <!-- 6) 양록 -->
    <ellipse rx="27" ry="33" fill="#5fa872"/>
    <!-- 7) 진녹 와운 베이스 -->
    <ellipse rx="24" ry="30" fill="#1a4828"/>

    <!-- 8) 와운 컬 (큰) — 진녹 베이스 위 양록 컬 -->
    <use href="#medallion-curls" x="-22" y="-22" width="44" height="44"/>

    <!-- 9) 측면 잎사귀 (마룬) — 좌·우 -->
    <use href="#wing" x="-26" y="-7" width="20" height="14"/>
    <use href="#wing" x="6" y="-7" width="20" height="14" transform="translate(0 0) scale(-1 1) translate(-100 0)"/>
    <!-- 9b) 위·아래 잎사귀 — 90도 회전 -->
    <g transform="rotate(90)">
      <use href="#wing" x="-32" y="-7" width="20" height="14"/>
      <use href="#wing" x="12" y="-7" width="20" height="14" transform="scale(-1 1)"/>
    </g>

    <!-- 10) 내부 노란 원 -->
    <circle r="13" fill="#f0c040" stroke="#1a4828" stroke-width="0.5"/>
    <!-- 11) 진녹 -->
    <circle r="11" fill="#1a4828"/>

    <!-- 12) 중앙 4잎 산호 화관 — 물결 페탈 -->
    <g>
      <!-- 위 페탈 (산호 주황) -->
      <path d="M0 -10 Q-3 -10 -5 -8 Q-7 -6 -6 -3 Q-4 -1 0 -2 Q4 -1 6 -3 Q7 -6 5 -8 Q3 -10 0 -10 Z"
            fill="#e89858" stroke="#8a2828" stroke-width="0.6"/>
      <!-- 우 -->
      <path d="M10 0 Q10 -3 8 -5 Q6 -7 3 -6 Q1 -4 2 0 Q1 4 3 6 Q6 7 8 5 Q10 3 10 0 Z"
            fill="#e89858" stroke="#8a2828" stroke-width="0.6"/>
      <!-- 아래 -->
      <path d="M0 10 Q-3 10 -5 8 Q-7 6 -6 3 Q-4 1 0 2 Q4 1 6 3 Q7 6 5 8 Q3 10 0 10 Z"
            fill="#e89858" stroke="#8a2828" stroke-width="0.6"/>
      <!-- 좌 -->
      <path d="M-10 0 Q-10 -3 -8 -5 Q-6 -7 -3 -6 Q-1 -4 -2 0 Q-1 4 -3 6 Q-6 7 -8 5 Q-10 3 -10 0 Z"
            fill="#e89858" stroke="#8a2828" stroke-width="0.6"/>

      <!-- 페탈 끝 적색 점 -->
      <g fill="#c83232">
        <circle cx="0" cy="-8" r="1.3"/>
        <circle cx="8" cy="0" r="1.3"/>
        <circle cx="0" cy="8" r="1.3"/>
        <circle cx="-8" cy="0" r="1.3"/>
      </g>

      <!-- 중심 노란 원 + 적 -->
      <circle r="3.2" fill="#f0d040" stroke="#8a2828" stroke-width="0.5"/>
      <circle r="0.9" fill="#c83232"/>
    </g>
  </g>

  <!-- ===== 외곽 양록 위 작은 와운 (장식 분산) ===== -->
  <g color="#5fa872" stroke-width="1.2">
    <use href="#whorl" x="46" y="11" width="8" height="14" transform="rotate(0 50 18)"/>
    <use href="#whorl" x="46" y="11" width="8" height="14" transform="translate(100 0) scale(-1 1) rotate(0 50 18)"/>
    <use href="#whorl" x="46" y="135" width="8" height="14" transform="scale(1 -1) translate(0 -160)"/>
    <use href="#whorl" x="46" y="135" width="8" height="14" transform="translate(100 -160) scale(-1 -1)"/>
  </g>

  <!-- ===== 좌우 측면 작은 청색 컬 ===== -->
  <g color="#5990c0">
    <use href="#whorl" x="9" y="74" width="8" height="12"/>
    <use href="#whorl" x="83" y="74" width="8" height="12" transform="translate(174 0) scale(-1 1)"/>
  </g>

  <!-- ===== 보석 점 (4 코너 안쪽) ===== -->
  <g fill="#f0c040">
    <circle cx="50" cy="14" r="1"/>
    <circle cx="50" cy="146" r="1"/>
  </g>
</svg>
