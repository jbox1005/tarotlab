<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 단청 정통 채색 — 녹색 베이스 + 청·적·황 + 산호 주황 -->
    <!-- 녹: 양록 / 진청: 군청 / 연청: 삼청 / 황: 자황 / 적: 진사 / 산호: 주황 -->

    <!-- 코너 소용돌이(渦) — 적+청 색구분 가능하도록 currentColor -->
    <symbol id="corner-curl" viewBox="-20 -20 40 40">
      <!-- 외곽 큰 곡선 (적색) -->
      <path d="M-18 -18 Q-18 -2 -8 -2 Q-2 -2 -2 -8 Q-2 -14 -8 -14 Q-12 -14 -12 -10 Q-12 -8 -10 -8"
            fill="none" stroke="#8a2828" stroke-width="3.6" stroke-linecap="round"/>
      <!-- 내부 작은 곡선 (청색) -->
      <path d="M-14 -14 Q-14 -6 -8 -6 Q-4 -6 -4 -10 Q-4 -12 -7 -12"
            fill="none" stroke="#5990c0" stroke-width="2.4" stroke-linecap="round"/>
      <!-- 끝점 -->
      <circle cx="-7" cy="-12" r="1.2" fill="#5990c0"/>
      <circle cx="-10" cy="-8" r="1" fill="#f0c040"/>
    </symbol>

    <!-- 중앙 와운(渦雲) — 작은 소용돌이 컬 -->
    <symbol id="curl-mini" viewBox="-6 -6 12 12">
      <path d="M0 0 Q-4 -4 -4 0 Q-4 4 0 4 Q4 4 4 0 Q4 -3 1 -3"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>

    <!-- 잎 — 측면 마룬 윙 -->
    <symbol id="wing-leaf" viewBox="-12 -6 24 12">
      <path d="M-12 0 Q-10 -5 -4 -5 Q4 -5 8 -2 Q12 0 8 2 Q4 5 -4 5 Q-10 5 -12 0 Z"
            fill="#6e2828" stroke="#3a1414" stroke-width="0.5"/>
      <path d="M-9 0 Q-6 -3 -2 -3 Q2 -3 5 -1" stroke="#c84838" stroke-width="0.6" fill="none"/>
    </symbol>
  </defs>

  <!-- ===== 베이스: 양록 ===== -->
  <rect width="100" height="160" fill="#2d6a3e"/>

  <!-- ===== 외곽 가장자리 ===== -->
  <rect x="2" y="2" width="96" height="156" rx="2" fill="none" stroke="#1a4828" stroke-width="1.2"/>
  <rect x="4" y="4" width="92" height="152" rx="1.5" fill="none" stroke="#f0c040" stroke-width="0.5"/>

  <!-- ===== 모서리 4개 — 적+청 소용돌이 ===== -->
  <use href="#corner-curl" x="0" y="0" width="36" height="36"/>
  <use href="#corner-curl" x="64" y="0" width="36" height="36" transform="translate(100 0) scale(-1 1)"/>
  <use href="#corner-curl" x="0" y="124" width="36" height="36" transform="translate(0 160) scale(1 -1)"/>
  <use href="#corner-curl" x="64" y="124" width="36" height="36" transform="translate(100 160) scale(-1 -1)"/>

  <!-- ===== 중앙 메달리온 (보상화) — 동심 다층 ===== -->
  <g transform="translate(50, 80)">
    <!-- 1) 외곽 진녹 원 -->
    <circle r="38" fill="#1a4828"/>

    <!-- 2) 양록 원 -->
    <circle r="34" fill="#5fa872"/>

    <!-- 3) 군청 원 -->
    <circle r="28" fill="#2a4488"/>

    <!-- 4) 노란 띠 -->
    <circle r="24" fill="#f0c040"/>

    <!-- 5) 진녹 -->
    <circle r="22" fill="#1a4828"/>

    <!-- 6) 양록 + 와운(渦雲) 패턴 — 주변 8방향 컬 -->
    <circle r="20" fill="#3a7848"/>
    <g color="#8fc09a">
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(45)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(90)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(135)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(180)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(225)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(270)"/>
      <use href="#curl-mini" x="-3" y="-19" width="6" height="6" transform="rotate(315)"/>
    </g>

    <!-- 7) 측면 마룬 윙 잎사귀 (좌·우) -->
    <use href="#wing-leaf" x="-32" y="-6" width="22" height="12"/>
    <use href="#wing-leaf" x="10" y="-6" width="22" height="12" transform="translate(0 0) scale(-1 1)" />

    <!-- 7b) 위·아래 마룬 윙 잎사귀 -->
    <g transform="rotate(90)">
      <use href="#wing-leaf" x="-32" y="-6" width="22" height="12"/>
      <use href="#wing-leaf" x="10" y="-6" width="22" height="12" transform="scale(-1 1)" />
    </g>

    <!-- 8) 내부 와운 디스크 -->
    <circle r="14" fill="#1a4828" stroke="#8fc09a" stroke-width="0.6"/>

    <!-- 8b) 내부 와운 컬 4개 -->
    <g color="#8fc09a">
      <use href="#curl-mini" x="-4" y="-12" width="8" height="8"/>
      <use href="#curl-mini" x="-4" y="-12" width="8" height="8" transform="rotate(90)"/>
      <use href="#curl-mini" x="-4" y="-12" width="8" height="8" transform="rotate(180)"/>
      <use href="#curl-mini" x="-4" y="-12" width="8" height="8" transform="rotate(270)"/>
    </g>

    <!-- 9) 중앙 4잎 산호 화관 -->
    <g>
      <!-- 4잎 (주황/산호) — 다이아몬드 배치 -->
      <g fill="#e89858" stroke="#8a2828" stroke-width="0.5">
        <!-- 위 -->
        <path d="M0 -12 Q-6 -8 -5 -3 Q-2 -1 0 -2 Q2 -1 5 -3 Q6 -8 0 -12 Z"/>
        <!-- 우 -->
        <path d="M12 0 Q8 -6 3 -5 Q1 -2 2 0 Q1 2 3 5 Q8 6 12 0 Z"/>
        <!-- 아래 -->
        <path d="M0 12 Q-6 8 -5 3 Q-2 1 0 2 Q2 1 5 3 Q6 8 0 12 Z"/>
        <!-- 좌 -->
        <path d="M-12 0 Q-8 -6 -3 -5 Q-1 -2 -2 0 Q-1 2 -3 5 Q-8 6 -12 0 Z"/>
      </g>

      <!-- 잎 끝 작은 적색 점 -->
      <g fill="#c83232">
        <circle cx="0" cy="-9" r="1.2"/>
        <circle cx="9" cy="0" r="1.2"/>
        <circle cx="0" cy="9" r="1.2"/>
        <circle cx="-9" cy="0" r="1.2"/>
      </g>

      <!-- 중심 노란 원 -->
      <circle r="3" fill="#f0d040"/>
      <circle r="3" fill="none" stroke="#8a2828" stroke-width="0.4"/>
      <circle r="0.8" fill="#c83232"/>
    </g>

    <!-- 10) 외곽 노란 점 4개 (시각 균형) -->
    <g fill="#f0c040">
      <circle cx="-21" cy="0" r="0.8"/>
      <circle cx="21" cy="0" r="0.8"/>
      <circle cx="0" cy="-21" r="0.8"/>
      <circle cx="0" cy="21" r="0.8"/>
    </g>
  </g>

  <!-- ===== 상·하 가장자리 작은 와운 (장식) ===== -->
  <g color="#8fc09a">
    <use href="#curl-mini" x="22" y="20" width="8" height="8"/>
    <use href="#curl-mini" x="70" y="20" width="8" height="8" transform="translate(78 0) scale(-1 1)"/>
    <use href="#curl-mini" x="22" y="132" width="8" height="8" transform="translate(0 144) scale(1 -1)"/>
    <use href="#curl-mini" x="70" y="132" width="8" height="8" transform="translate(78 144) scale(-1 -1)"/>
  </g>

  <!-- ===== 상·하 중앙 점 ===== -->
  <g fill="#f0c040">
    <circle cx="50" cy="14" r="1"/>
    <circle cx="50" cy="146" r="1"/>
  </g>
</svg>
