  </defs>
  <rect width="100" height="160" fill="url(#ckg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#c9a656" stroke-width="0.6"/>

  <!-- 외곽 매듭 보더 — 상하 -->
