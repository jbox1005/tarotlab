<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 홀로그래픽 무지개 그라디언트 (대각선) -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ec7"/>
      <stop offset="0.2" stop-color="#a78cff"/>
      <stop offset="0.4" stop-color="#5fc4ff"/>
      <stop offset="0.6" stop-color="#5fffd4"/>
      <stop offset="0.8" stop-color="#ffe478"/>
      <stop offset="1" stop-color="#ff8ec0"/>
    </linearGradient>

    <!-- 보조 그라디언트 (반대 방향) -->
    <linearGradient id="holo2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ec0" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5fc4ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78cff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 광택 줄무늬 패턴 -->
    <pattern id="shimmer" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="0.4" opacity="0.18"/>
    </pattern>

    <!-- 광택 빛 줄 (밝은 띠) -->
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 베이스 무지개 -->
  <rect width="100" height="160" fill="url(#holo)"/>
  <!-- 두 번째 그라디언트 오버레이 (블렌드 효과) -->
  <rect width="100" height="160" fill="url(#holo2)"/>
  <!-- 광택 줄무늬 -->
  <rect width="100" height="160" fill="url(#shimmer)"/>

  <!-- 대각 광택 띠 (홀로 카드 빛 반사) -->
  <rect width="100" height="160" fill="url(#streak)" opacity="0.6"/>

  <!-- 추가 미세 도트 (반짝임) -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="22" cy="32" r="0.5"/>
    <circle cx="78" cy="48" r="0.4"/>
    <circle cx="32" cy="80" r="0.6"/>
    <circle cx="68" cy="100" r="0.4"/>
    <circle cx="40" cy="124" r="0.5"/>
    <circle cx="58" cy="20" r="0.4"/>
    <circle cx="84" cy="120" r="0.5"/>
    <circle cx="14" cy="68" r="0.4"/>
    <circle cx="50" cy="146" r="0.6"/>
  </g>

  <!-- 프레임 (은빛) -->
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.85"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.55"/>
</svg>
