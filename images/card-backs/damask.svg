<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#251420"/>
      <stop offset="1" stop-color="#150a14"/>
    </linearGradient>

    <!-- 다마스크 모티프: 4방향 대칭 와류 + 꽃 -->
    <pattern id="damask" x="0" y="0" width="40" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8b478" stroke-width="0.5" opacity="0.7">
        <!-- 중앙 다이아몬드 꽃 -->
        <g transform="translate(20 28)">
          <!-- 꽃잎 4장 -->
          <path d="M 0 -10 Q 6 -6 0 0 Q -6 -6 0 -10 Z" fill="#e8b478" fill-opacity="0.4"/>
          <path d="M 10 0 Q 6 6 0 0 Q 6 -6 10 0 Z" fill="#e8b478" fill-opacity="0.4"/>
          <path d="M 0 10 Q -6 6 0 0 Q 6 6 0 10 Z" fill="#e8b478" fill-opacity="0.4"/>
          <path d="M -10 0 Q -6 -6 0 0 Q -6 6 -10 0 Z" fill="#e8b478" fill-opacity="0.4"/>
          <!-- 중심 -->
          <circle r="1.6" fill="#e8b478"/>
        </g>

        <!-- 모서리 4 곳 와류 (다이아몬드 격자 효과) -->
        <g transform="translate(0 0)">
          <path d="M 0 0 Q 4 4 0 8 Q -4 4 0 0 Z" fill="#e8b478" fill-opacity="0.25"/>
        </g>
        <g transform="translate(40 0)">
          <path d="M 0 0 Q -4 4 0 8 Q 4 4 0 0 Z" fill="#e8b478" fill-opacity="0.25"/>
        </g>
        <g transform="translate(0 56)">
          <path d="M 0 0 Q 4 -4 0 -8 Q -4 -4 0 0 Z" fill="#e8b478" fill-opacity="0.25"/>
        </g>
        <g transform="translate(40 56)">
          <path d="M 0 0 Q -4 -4 0 -8 Q 4 -4 0 0 Z" fill="#e8b478" fill-opacity="0.25"/>
        </g>

        <!-- 가장자리 작은 잎 (위/아래 중앙) -->
        <g transform="translate(20 4)">
          <path d="M 0 0 Q 2 3 0 6 Q -2 3 0 0 Z" fill="#e8b478" fill-opacity="0.3"/>
        </g>
        <g transform="translate(20 52)">
          <path d="M 0 0 Q 2 -3 0 -6 Q -2 -3 0 0 Z" fill="#e8b478" fill-opacity="0.3"/>
        </g>
        <!-- 좌/우 중앙 -->
        <g transform="translate(2 28)">
          <path d="M 0 0 Q 3 2 6 0 Q 3 -2 0 0 Z" fill="#e8b478" fill-opacity="0.3"/>
        </g>
        <g transform="translate(38 28)">
          <path d="M 0 0 Q -3 2 -6 0 Q -3 -2 0 0 Z" fill="#e8b478" fill-opacity="0.3"/>
        </g>
      </g>
    </pattern>
  </defs>

  <rect width="100" height="160" fill="url(#bg)"/>
  <rect width="100" height="160" fill="url(#damask)"/>

  <!-- 프레임 -->
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#e8b478" stroke-width="0.9"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#e8b478" stroke-width="0.4" opacity="0.5"/>
  <!-- 안쪽 데코 보더 -->
  <rect x="11" y="11" width="78" height="138" rx="2" fill="none" stroke="#e8b478" stroke-width="0.25" opacity="0.35"/>
</svg>
