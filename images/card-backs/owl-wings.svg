<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="owl-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0e2018"/>
      <stop offset="1" stop-color="#04100a"/>
    </linearGradient>
    <radialGradient id="owl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8d8c0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c8d8c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="160" fill="url(#owl-bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#c8d8c0" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#c8d8c0" stroke-width="0.3" opacity="0.5"/>
  <circle cx="50" cy="80" r="34" fill="url(#owl-glow)"/>

  <!-- ===== 부엉이 ===== -->
  <g stroke="#c8d8c0" stroke-width="0.7" fill="none" stroke-linecap="round">

    <!-- 머리 (둥근 윤곽) -->
    <g transform="translate(50 70)">
      <path d="M -10 -2 Q -10 -12 -4 -16 Q 0 -19 4 -16 Q 10 -12 10 -2 Q 10 4 0 6 Q -10 4 -10 -2 Z"
            stroke-width="0.9"/>
      <!-- 머리 깃털(귀) — 양쪽 -->
      <path d="M -8 -10 L -10 -16 L -6 -13" stroke-width="0.8"/>
      <path d="M 8 -10 L 10 -16 L 6 -13" stroke-width="0.8"/>
    </g>

    <!-- 큰 두 눈 -->
    <g transform="translate(50 70)">
      <!-- 외곽 -->
      <circle cx="-4" cy="-2" r="3.5" stroke-width="0.7"/>
      <circle cx="4" cy="-2" r="3.5" stroke-width="0.7"/>
      <!-- 중간 -->
      <circle cx="-4" cy="-2" r="2" stroke-width="0.4"/>
      <circle cx="4" cy="-2" r="2" stroke-width="0.4"/>
      <!-- 동공 -->
      <circle cx="-4" cy="-2" r="0.9" fill="#c8d8c0" stroke="none"/>
      <circle cx="4" cy="-2" r="0.9" fill="#c8d8c0" stroke="none"/>
      <!-- 눈 사이 작은 부리 -->
      <path d="M 0 1 L -0.7 3 L 0.7 3 Z" fill="#c8d8c0" stroke="none"/>
    </g>

    <!-- 펼친 날개 — 좌측 (옆으로 뻗음) -->
    <g transform="translate(50 78)">
      <!-- 외곽 윤곽 -->
      <path d="M -10 0 Q -22 -2 -32 4 Q -22 6 -10 6" stroke-width="1"/>
      <!-- 깃털 줄 1 -->
      <g opacity="0.8">
        <path d="M -12 1 Q -18 0 -24 4"/>
        <path d="M -14 3 Q -20 2 -26 5"/>
        <path d="M -16 5 Q -22 5 -28 5"/>
      </g>
    </g>

    <!-- 펼친 날개 — 우측 -->
    <g transform="translate(50 78)">
      <path d="M 10 0 Q 22 -2 32 4 Q 22 6 10 6" stroke-width="1"/>
      <g opacity="0.8">
        <path d="M 12 1 Q 18 0 24 4"/>
        <path d="M 14 3 Q 20 2 26 5"/>
        <path d="M 16 5 Q 22 5 28 5"/>
      </g>
    </g>

    <!-- 몸통 — 가슴 깃털 패턴 -->
    <g transform="translate(50 86)">
      <path d="M -7 -2 Q 0 4 7 -2 Q 7 16 0 22 Q -7 16 -7 -2 Z" stroke-width="0.8"/>
      <!-- 가슴 깃털 V 패턴 -->
      <g opacity="0.75" stroke-width="0.5">
        <path d="M -5 2 Q 0 5 5 2"/>
        <path d="M -5 6 Q 0 9 5 6"/>
        <path d="M -4 10 Q 0 13 4 10"/>
        <path d="M -3 14 Q 0 16 3 14"/>
      </g>
    </g>

    <!-- 발 (작게) -->
    <g transform="translate(50 110)" stroke-width="0.6">
      <path d="M -3 0 L -3 4"/>
      <path d="M -4 4 L -2 4"/>
      <path d="M 3 0 L 3 4"/>
      <path d="M 2 4 L 4 4"/>
    </g>

    <!-- 위쪽 작은 별 -->
    <g transform="translate(50 36)" fill="#c8d8c0" stroke="none">
      <path d="M 0 -3 L 0.7 -0.7 L 3 0 L 0.7 0.7 L 0 3 L -0.7 0.7 L -3 0 L -0.7 -0.7 Z"/>
    </g>
    <!-- 보조 별 -->
    <g fill="#c8d8c0" stroke="none" opacity="0.7">
      <circle cx="22" cy="42" r="0.6"/>
      <circle cx="78" cy="42" r="0.6"/>
      <circle cx="20" cy="120" r="0.5"/>
      <circle cx="80" cy="120" r="0.5"/>
    </g>
  </g>
</svg>
