<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ktg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0820"/>
      <stop offset="1" stop-color="#04020e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#ktg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d8c280" stroke-width="0.6"/>

  <!-- 22 경로 (Path) — 먼저 그려서 세피로트 아래로 -->
  <g stroke="#d8c280" stroke-width="0.5" opacity="0.55" fill="none">
    <!-- 1-2, 1-3 (왕관 → 지혜·이해) -->
    <line x1="50" y1="22" x2="32" y2="40"/>
    <line x1="50" y1="22" x2="68" y2="40"/>
    <!-- 2-3 -->
    <line x1="32" y1="40" x2="68" y2="40"/>
    <!-- 2-4, 3-5 -->
    <line x1="32" y1="40" x2="32" y2="62"/>
    <line x1="68" y1="40" x2="68" y2="62"/>
    <!-- 4-5 -->
    <line x1="32" y1="62" x2="68" y2="62"/>
    <!-- 1-6, 2-6, 3-6 -->
    <line x1="50" y1="22" x2="50" y2="80"/>
    <line x1="32" y1="40" x2="50" y2="80"/>
    <line x1="68" y1="40" x2="50" y2="80"/>
    <!-- 4-6, 5-6 -->
    <line x1="32" y1="62" x2="50" y2="80"/>
    <line x1="68" y1="62" x2="50" y2="80"/>
    <!-- 4-7, 5-8 -->
    <line x1="32" y1="62" x2="32" y2="100"/>
    <line x1="68" y1="62" x2="68" y2="100"/>
    <!-- 6-7, 6-8 -->
    <line x1="50" y1="80" x2="32" y2="100"/>
    <line x1="50" y1="80" x2="68" y2="100"/>
    <!-- 7-8 -->
    <line x1="32" y1="100" x2="68" y2="100"/>
    <!-- 6-9 -->
    <line x1="50" y1="80" x2="50" y2="120"/>
    <!-- 7-9, 8-9 -->
    <line x1="32" y1="100" x2="50" y2="120"/>
    <line x1="68" y1="100" x2="50" y2="120"/>
    <!-- 9-10 -->
    <line x1="50" y1="120" x2="50" y2="140"/>
    <!-- 7-10, 8-10 -->
    <line x1="32" y1="100" x2="50" y2="140"/>
    <line x1="68" y1="100" x2="50" y2="140"/>
  </g>

  <!-- 10 세피로트 -->
  <g fill="#d8c280" stroke="#0a0820" stroke-width="0.4">
    <!-- 1 케테르 (왕관) -->
    <circle cx="50" cy="22" r="4.2"/>
    <!-- 2 호크마 (지혜) -->
    <circle cx="32" cy="40" r="3.6"/>
    <!-- 3 비나 (이해) -->
    <circle cx="68" cy="40" r="3.6"/>
    <!-- 4 헤세드 (자비) -->
    <circle cx="32" cy="62" r="3.6"/>
    <!-- 5 게부라 (엄정) -->
    <circle cx="68" cy="62" r="3.6"/>
    <!-- 6 티페렛 (아름다움) -->
    <circle cx="50" cy="80" r="4.2"/>
    <!-- 7 네차흐 (영원) -->
    <circle cx="32" cy="100" r="3.6"/>
    <!-- 8 호드 (영광) -->
    <circle cx="68" cy="100" r="3.6"/>
    <!-- 9 예소드 (기초) -->
    <circle cx="50" cy="120" r="3.6"/>
    <!-- 10 말쿠트 (왕국) -->
    <circle cx="50" cy="140" r="4.2"/>
  </g>

  <!-- 중심 점 (장식) -->
  <g fill="#04020e" opacity="0.7">
    <circle cx="50" cy="22" r="0.8"/>
    <circle cx="50" cy="80" r="0.8"/>
    <circle cx="50" cy="140" r="0.8"/>
  </g>
</svg>
