<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#0c1a3a"/>
      <stop offset="1" stop-color="#020610"/>
    </radialGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>

  <!-- 외곽 천체 원 -->
  <circle cx="50" cy="80" r="44" fill="none" stroke="#5fc4e0" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="80" r="40" fill="none" stroke="#5fc4e0" stroke-width="0.3" opacity="0.4"/>

  <!-- 황도 12궁 분할선 (작게) -->
  <g stroke="#5fc4e0" stroke-width="0.2" opacity="0.3">
    <g transform="translate(50 80)">
      <line x1="38" y1="0" x2="44" y2="0"/>
      <line x1="-38" y1="0" x2="-44" y2="0"/>
      <line x1="0" y1="38" x2="0" y2="44"/>
      <line x1="0" y1="-38" x2="0" y2="-44"/>
      <line x1="26.87" y1="-26.87" x2="31.11" y2="-31.11"/>
      <line x1="-26.87" y1="-26.87" x2="-31.11" y2="-31.11"/>
      <line x1="26.87" y1="26.87" x2="31.11" y2="31.11"/>
      <line x1="-26.87" y1="26.87" x2="-31.11" y2="31.11"/>
    </g>
  </g>

  <!-- 별 점들 (큰 별 7개로 별자리 모양 — 큰곰자리 풍) -->
  <g fill="#c8e8f4">
    <circle cx="32" cy="62" r="1.6"/>
    <circle cx="40" cy="58" r="1.4"/>
    <circle cx="48" cy="64" r="1.8"/>
    <circle cx="55" cy="72" r="1.4"/>
    <circle cx="64" cy="74" r="1.8"/>
    <circle cx="62" cy="86" r="1.4"/>
    <circle cx="68" cy="94" r="1.6"/>
  </g>

  <!-- 별자리 연결선 -->
  <g stroke="#5fc4e0" stroke-width="0.5" opacity="0.7" fill="none">
    <line x1="32" y1="62" x2="40" y2="58"/>
    <line x1="40" y1="58" x2="48" y2="64"/>
    <line x1="48" y1="64" x2="55" y2="72"/>
    <line x1="55" y1="72" x2="64" y2="74"/>
    <line x1="64" y1="74" x2="62" y2="86"/>
    <line x1="62" y1="86" x2="68" y2="94"/>
  </g>

  <!-- 두 번째 별자리 (하단) -->
  <g fill="#c8e8f4">
    <circle cx="34" cy="108" r="1.4"/>
    <circle cx="42" cy="116" r="1.2"/>
    <circle cx="38" cy="124" r="1.6"/>
    <circle cx="46" cy="130" r="1.2"/>
    <circle cx="54" cy="124" r="1.4"/>
  </g>
  <g stroke="#5fc4e0" stroke-width="0.4" opacity="0.6" fill="none">
    <line x1="34" y1="108" x2="42" y2="116"/>
    <line x1="42" y1="116" x2="38" y2="124"/>
    <line x1="38" y1="124" x2="46" y2="130"/>
    <line x1="46" y1="130" x2="54" y2="124"/>
  </g>

  <!-- 산재한 별 -->
  <g fill="#c8e8f4">
    <circle cx="20" cy="40" r="0.6" opacity="0.7"/>
    <circle cx="78" cy="38" r="0.8" opacity="0.8"/>
    <circle cx="22" cy="80" r="0.5" opacity="0.5"/>
    <circle cx="80" cy="60" r="0.7" opacity="0.7"/>
    <circle cx="14" cy="120" r="0.6" opacity="0.6"/>
    <circle cx="82" cy="130" r="0.8" opacity="0.7"/>
    <circle cx="74" cy="108" r="0.5" opacity="0.5"/>
    <circle cx="26" cy="142" r="0.6" opacity="0.6"/>
    <circle cx="58" cy="42" r="0.5" opacity="0.5"/>
    <circle cx="68" cy="50" r="0.4" opacity="0.4"/>
    <circle cx="38" cy="146" r="0.5" opacity="0.5"/>
    <circle cx="86" cy="80" r="0.6" opacity="0.6"/>
    <circle cx="16" cy="56" r="0.4" opacity="0.4"/>
  </g>

  <!-- 프레임 -->
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#5fc4e0" stroke-width="0.7" opacity="0.7"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#5fc4e0" stroke-width="0.3" opacity="0.4"/>
</svg>
