<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2a1a0a"/>
      <stop offset="1" stop-color="#0e0604"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8c520" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8c520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#e8c520" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#e8c520" stroke-width="0.3" opacity="0.5"/>
  <!-- 광선 -->
  <g transform="translate(50 80)" stroke="#e8c520" stroke-width="0.6" opacity="0.7">
    <line x1="0" y1="-44" x2="0" y2="-30"/>
    <line x1="0" y1="44" x2="0" y2="30"/>
    <line x1="-44" y1="0" x2="-30" y2="0"/>
    <line x1="44" y1="0" x2="30" y2="0"/>
    <line x1="-31" y1="-31" x2="-21" y2="-21"/>
    <line x1="31" y1="-31" x2="21" y2="-21"/>
    <line x1="-31" y1="31" x2="-21" y2="21"/>
    <line x1="31" y1="31" x2="21" y2="21"/>
  </g>
  <circle cx="50" cy="80" r="38" fill="url(#halo)"/>
  <!-- 호루스의 눈 -->
  <g transform="translate(50 80)">
    <ellipse cx="0" cy="0" rx="22" ry="10" fill="none" stroke="#e8c520" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6" fill="#0e0604" stroke="#e8c520" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#e8c520"/>
    <path d="M -22 0 Q -28 6 -32 12" fill="none" stroke="#e8c520" stroke-width="1"/>
    <path d="M 16 6 Q 12 14 8 18" fill="none" stroke="#e8c520" stroke-width="1"/>
  </g>
</svg>
