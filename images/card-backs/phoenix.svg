<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="phx-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a0c10"/>
      <stop offset="1" stop-color="#0e0306"/>
    </linearGradient>
    <radialGradient id="phx-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4d4a0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f4d4a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="160" fill="url(#phx-bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#f4d4a0" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#f4d4a0" stroke-width="0.3" opacity="0.5"/>
  <circle cx="50" cy="80" r="34" fill="url(#phx-glow)"/>

  <!-- ===== 불사조 ===== -->
  <g stroke="#f4d4a0" stroke-width="0.7" fill="none" stroke-linecap="round">

    <!-- 좌측 펼친 날개 (위로 뻗음) -->
    <g transform="translate(50 80)">
      <!-- 날개 주축 -->
      <path d="M 0 0 C -8 -8 -16 -18 -22 -34" stroke-width="1.2"/>
      <!-- 깃털 끝부분 (위에서 아래로 줄어드는 곡선) -->
      <g opacity="0.85">
        <path d="M -3 -4 Q -10 -6 -12 -2"/>
        <path d="M -5 -10 Q -14 -12 -16 -7"/>
        <path d="M -8 -16 Q -18 -18 -20 -13"/>
        <path d="M -12 -22 Q -22 -23 -23 -18"/>
        <path d="M -16 -28 Q -24 -28 -24 -23"/>
        <path d="M -20 -32 Q -25 -32 -24 -28"/>
        <!-- 안쪽 짧은 깃털 -->
        <path d="M -3 -4 Q -2 -10 -5 -14"/>
        <path d="M -5 -10 Q -4 -16 -8 -20"/>
        <path d="M -8 -16 Q -8 -22 -12 -26"/>
      </g>
    </g>

    <!-- 우측 펼친 날개 -->
    <g transform="translate(50 80)">
      <path d="M 0 0 C 8 -8 16 -18 22 -34" stroke-width="1.2"/>
      <g opacity="0.85">
        <path d="M 3 -4 Q 10 -6 12 -2"/>
        <path d="M 5 -10 Q 14 -12 16 -7"/>
        <path d="M 8 -16 Q 18 -18 20 -13"/>
        <path d="M 12 -22 Q 22 -23 23 -18"/>
        <path d="M 16 -28 Q 24 -28 24 -23"/>
        <path d="M 20 -32 Q 25 -32 24 -28"/>
        <path d="M 3 -4 Q 2 -10 5 -14"/>
        <path d="M 5 -10 Q 4 -16 8 -20"/>
        <path d="M 8 -16 Q 8 -22 12 -26"/>
      </g>
    </g>

    <!-- 머리 + 부리 -->
    <g transform="translate(50 56)">
      <path d="M -2 0 Q 0 -3 2 0 Q 4 4 0 6 Q -4 4 -2 0 Z" stroke-width="0.9"/>
      <!-- 부리 살짝 -->
      <path d="M 0 -2 L 1 -5"/>
      <!-- 눈 -->
      <circle cx="0" cy="2" r="0.6" fill="#f4d4a0" stroke="none"/>
    </g>

    <!-- 가운데 몸통 -->
    <g transform="translate(50 80)">
      <path d="M 0 -18 Q -1 -10 0 -2 Q 1 -10 0 -18" stroke-width="0.7"/>
    </g>

    <!-- 꼬리 깃털 (아래로 흘러내림) -->
    <g transform="translate(50 80)" opacity="0.85">
      <path d="M -1 8 Q -5 16 -3 28" stroke-width="1.0"/>
      <path d="M 1 8 Q 5 16 3 28" stroke-width="1.0"/>
      <path d="M 0 8 Q 0 18 0 32" stroke-width="0.9"/>
      <path d="M -3 12 Q -8 22 -7 34"/>
      <path d="M 3 12 Q 8 22 7 34"/>
      <!-- 꼬리 끝 잔물결 -->
      <path d="M -7 34 Q -6 36 -5 34"/>
      <path d="M 7 34 Q 6 36 5 34"/>
      <path d="M 0 32 Q 1 34 -1 34"/>
    </g>

    <!-- 위쪽 별 -->
    <g transform="translate(50 36)" fill="#f4d4a0" stroke="none">
      <path d="M 0 -3 L 0.7 -0.7 L 3 0 L 0.7 0.7 L 0 3 L -0.7 0.7 L -3 0 L -0.7 -0.7 Z"/>
    </g>

    <!-- 작은 불꽃 점들 -->
    <g fill="#f4d4a0" stroke="none">
      <circle cx="50" cy="118" r="0.7" opacity="0.85"/>
      <circle cx="42" cy="124" r="0.5" opacity="0.7"/>
      <circle cx="58" cy="124" r="0.5" opacity="0.7"/>
      <circle cx="46" cy="130" r="0.4" opacity="0.55"/>
      <circle cx="54" cy="130" r="0.4" opacity="0.55"/>
    </g>
  </g>
</svg>
