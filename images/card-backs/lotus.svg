      <path transform="rotate(180)" d="M 0 -32 Q 8 -16 0 0 Q -8 -16 0 -32 Z"/>
      <path transform="rotate(225)" d="M 0 -32 Q 8 -16 0 0 Q -8 -16 0 -32 Z"/>
