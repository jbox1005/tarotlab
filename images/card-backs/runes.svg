<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d4b070" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#d4b070" stroke-width="0.3" opacity="0.5"/>
  <!-- 룬 격자 -->
  <g stroke="#d4b070" stroke-width="0.7" fill="none" stroke-linecap="round">
    <!-- Row 1 -->
    <g transform="translate(25 32)">
      <line x1="-4" y1="-6" x2="-4" y2="6"/>
      <line x1="-4" y1="-6" x2="4" y2="0"/>
      <line x1="-4" y1="6" x2="4" y2="0"/>
    </g>
    <g transform="translate(50 32)">
      <line x1="-4" y1="-6" x2="-4" y2="6"/>
      <line x1="4" y1="-6" x2="4" y2="6"/>
      <line x1="-4" y1="0" x2="4" y2="0"/>
    </g>
    <g transform="translate(75 32)">
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="0" y1="-6" x2="5" y2="-3"/>
      <line x1="0" y1="0" x2="5" y2="3"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(25 80)">
      <line x1="-4" y1="-6" x2="4" y2="6"/>
      <line x1="4" y1="-6" x2="-4" y2="6"/>
    </g>
    <g transform="translate(50 80)" stroke-width="1">
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-6" y1="-3" x2="6" y2="3"/>
      <line x1="-6" y1="3" x2="6" y2="-3"/>
    </g>
    <g transform="translate(75 80)">
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="-3" y1="-3" x2="3" y2="-3"/>
      <line x1="-3" y1="3" x2="3" y2="3"/>
    </g>
    <!-- Row 3 -->
    <g transform="translate(25 128)">
      <line x1="-4" y1="-6" x2="-4" y2="6"/>
      <line x1="-4" y1="-6" x2="4" y2="-6"/>
      <line x1="-4" y1="0" x2="3" y2="0"/>
    </g>
    <g transform="translate(50 128)">
      <line x1="-4" y1="-6" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="-4" y2="6"/>
      <line x1="0" y1="0" x2="4" y2="-6"/>
      <line x1="0" y1="0" x2="4" y2="6"/>
    </g>
    <g transform="translate(75 128)">
      <line x1="-4" y1="-6" x2="-4" y2="6"/>
      <line x1="-4" y1="-6" x2="4" y2="6"/>
      <line x1="4" y1="-6" x2="4" y2="6"/>
    </g>
  </g>
  <!-- 중앙 인장 -->
  <g transform="translate(50 80)" fill="none" stroke="#d4b070" stroke-width="0.4" opacity="0.55">
    <circle r="22"/>
    <circle r="16"/>
  </g>
</svg>
