<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="yyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f30"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <symbol id="trigram" viewBox="-10 -3 20 6">
      <rect x="-9" y="-2" width="18" height="1.4" fill="#e8c574"/>
      <rect x="-9" y="0.6" width="18" height="1.4" fill="#e8c574"/>
    </symbol>
    <symbol id="brokenline" viewBox="-10 -3 20 6">
      <rect x="-9" y="-2" width="7" height="1.4" fill="#e8c574"/>
      <rect x="2" y="-2" width="7" height="1.4" fill="#e8c574"/>
      <rect x="-9" y="0.6" width="7" height="1.4" fill="#e8c574"/>
      <rect x="2" y="0.6" width="7" height="1.4" fill="#e8c574"/>
    </symbol>
  </defs>
  <rect width="100" height="160" fill="url(#yyg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#e8c574" stroke-width="0.6"/>

  <!-- 태극 — 음양 -->
  <g transform="translate(50, 80)">
    <circle r="22" fill="#e8c574"/>
    <path d="M0 -22 A22 22 0 0 1 0 22 A11 11 0 0 0 0 0 A11 11 0 0 1 0 -22 Z" fill="#0a0e1c"/>
    <circle cx="0" cy="-11" r="3.5" fill="#0a0e1c"/>
    <circle cx="0" cy="11" r="3.5" fill="#e8c574"/>
    <circle cx="0" cy="-11" r="1.2" fill="#e8c574"/>
    <circle cx="0" cy="11" r="1.2" fill="#0a0e1c"/>
  </g>

  <!-- 8괘 - 상단·하단·좌·우 + 대각 4 -->
  <!-- 건 ☰ (상단) -->
  <g transform="translate(50, 30)">
    <use href="#trigram" width="20" height="6" x="-10" y="-6"/>
    <use href="#trigram" width="20" height="6" x="-10" y="-2"/>
    <use href="#trigram" width="20" height="6" x="-10" y="2"/>
  </g>

  <!-- 곤 ☷ (하단) -->
  <g transform="translate(50, 130)">
    <use href="#brokenline" width="20" height="6" x="-10" y="-6"/>
    <use href="#brokenline" width="20" height="6" x="-10" y="-2"/>
    <use href="#brokenline" width="20" height="6" x="-10" y="2"/>
  </g>

  <!-- 리 ☲ (왼쪽) — 가운데만 끊어짐 -->
  <g transform="translate(20, 80) rotate(90)">
    <use href="#trigram" width="20" height="6" x="-10" y="-6"/>
    <use href="#brokenline" width="20" height="6" x="-10" y="-2"/>
    <use href="#trigram" width="20" height="6" x="-10" y="2"/>
  </g>

  <!-- 감 ☵ (오른쪽) — 가운데만 -->
  <g transform="translate(80, 80) rotate(90)">
    <use href="#brokenline" width="20" height="6" x="-10" y="-6"/>
    <use href="#trigram" width="20" height="6" x="-10" y="-2"/>
    <use href="#brokenline" width="20" height="6" x="-10" y="2"/>
  </g>

  <!-- 외곽 점 -->
  <g fill="#e8c574">
    <circle cx="50" cy="14" r="0.8"/>
    <circle cx="50" cy="146" r="0.8"/>
    <circle cx="14" cy="80" r="0.8"/>
    <circle cx="86" cy="80" r="0.8"/>
  </g>
</svg>
