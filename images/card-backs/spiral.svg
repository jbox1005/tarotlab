<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d1d1a"/>
      <stop offset="1" stop-color="#040c0a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#c9a656" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#c9a656" stroke-width="0.3" opacity="0.5"/>
  <!-- 트리플 켈틱 스파이럴 (트리스켈리온) -->
  <g transform="translate(50 80)" fill="none" stroke="#c9a656" stroke-width="1.2" stroke-linecap="round">
    <!-- 상단 스파이럴 -->
    <path transform="rotate(-90)" d="M 0 0 Q 10 -8 16 0 Q 14 12 4 14 Q -4 12 -2 4 Q 2 -2 6 2"/>
    <!-- 좌하 스파이럴 -->
    <path transform="rotate(30)" d="M 0 0 Q 10 -8 16 0 Q 14 12 4 14 Q -4 12 -2 4 Q 2 -2 6 2"/>
    <!-- 우하 스파이럴 -->
    <path transform="rotate(150)" d="M 0 0 Q 10 -8 16 0 Q 14 12 4 14 Q -4 12 -2 4 Q 2 -2 6 2"/>
    <!-- 중앙 점 -->
    <circle r="2" fill="#c9a656" stroke="none"/>
    <!-- 외곽 -->
    <circle r="34" stroke-width="0.5" opacity="0.6"/>
  </g>
</svg>
