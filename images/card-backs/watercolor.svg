<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 베이스: 따뜻한 크림 종이 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efde"/>
      <stop offset="1" stop-color="#ecdfc4"/>
    </linearGradient>

    <!-- 수채 워시 — 부드러운 보라 -->
    <radialGradient id="wash1" cx="35%" cy="30%" r="50%">
      <stop offset="0" stop-color="#a98bd0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#a98bd0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a98bd0" stop-opacity="0"/>
    </radialGradient>

    <!-- 수채 워시 — 차가운 청록 -->
    <radialGradient id="wash2" cx="70%" cy="65%" r="45%">
      <stop offset="0" stop-color="#7dc4c0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7dc4c0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7dc4c0" stop-opacity="0"/>
    </radialGradient>

    <!-- 수채 워시 — 따뜻한 핑크 -->
    <radialGradient id="wash3" cx="55%" cy="20%" r="35%">
      <stop offset="0" stop-color="#e896a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e896a8" stop-opacity="0"/>
    </radialGradient>

    <!-- 수채 워시 — 머스타드 -->
    <radialGradient id="wash4" cx="20%" cy="80%" r="35%">
      <stop offset="0" stop-color="#d8b060" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d8b060" stop-opacity="0"/>
    </radialGradient>

    <!-- 종이 텍스처 (작은 노이즈) -->
    <pattern id="grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"/>
      <circle cx="1" cy="1" r="0.18" fill="#8a7858" opacity="0.12"/>
      <circle cx="2.2" cy="2.4" r="0.12" fill="#8a7858" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- 종이 베이스 -->
  <rect width="100" height="160" fill="url(#paper)"/>

  <!-- 워시 레이어들 (겹쳐서 수채 효과) -->
  <rect width="100" height="160" fill="url(#wash1)"/>
  <rect width="100" height="160" fill="url(#wash2)"/>
  <rect width="100" height="160" fill="url(#wash3)"/>
  <rect width="100" height="160" fill="url(#wash4)"/>

  <!-- 수채 점들 (잔잔한 얼룩) -->
  <g opacity="0.4">
    <ellipse cx="28" cy="50" rx="14" ry="10" fill="#a98bd0" opacity="0.18"/>
    <ellipse cx="72" cy="92" rx="16" ry="12" fill="#7dc4c0" opacity="0.16"/>
    <ellipse cx="50" cy="130" rx="20" ry="8" fill="#d8b060" opacity="0.15"/>
  </g>

  <!-- 종이 그레인 -->
  <rect width="100" height="160" fill="url(#grain)"/>

  <!-- 손그림 느낌의 거친 프레임 -->
  <rect x="6" y="6" width="88" height="148" rx="2" fill="none" stroke="#5a4a3a" stroke-width="0.6" opacity="0.55"
        stroke-dasharray="0.5 0.3"/>
  <rect x="9" y="9" width="82" height="142" rx="2" fill="none" stroke="#5a4a3a" stroke-width="0.3" opacity="0.35"/>

  <!-- 중앙 작은 수채 모티프 (별/달 추상) -->
  <g transform="translate(50 80)" opacity="0.55">
    <circle r="14" fill="#e8b478" opacity="0.35"/>
    <circle r="14" fill="none" stroke="#5a4a3a" stroke-width="0.3" stroke-dasharray="0.4 0.3"/>
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#5a4a3a" opacity="0.55"/>
  </g>

  <!-- 모서리 작은 잎 장식 -->
  <g fill="#5a4a3a" opacity="0.3">
    <path d="M 14 18 q 2 -2 4 0 q -2 2 -4 0 z"/>
    <path d="M 86 18 q -2 -2 -4 0 q 2 2 4 0 z"/>
    <path d="M 14 142 q 2 2 4 0 q -2 -2 -4 0 z"/>
    <path d="M 86 142 q -2 2 -4 0 q 2 -2 4 0 z"/>
  </g>
</svg>
