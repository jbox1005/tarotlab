<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#0c0306"/>
    </linearGradient>
  </defs>
  <rect width="100" height="160" fill="url(#bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d4a847" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#d4a847" stroke-width="0.3" opacity="0.5"/>
  <g transform="translate(50 80)" stroke="#d4a847" stroke-width="0.5" fill="none">
    <!-- 외곽 -->
    <circle r="36" stroke-width="0.9"/>
    <circle r="32" opacity="0.5"/>
    <!-- 12개의 꽃잎 (방사형) -->
    <g>
      <ellipse cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(30)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(60)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(90)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(120)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(150)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(180)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(210)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(240)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(270)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(300)" cx="0" cy="-22" rx="5" ry="11"/>
      <ellipse transform="rotate(330)" cx="0" cy="-22" rx="5" ry="11"/>
