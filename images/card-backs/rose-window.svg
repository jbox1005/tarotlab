      <circle cx="18" cy="-31.2" r="1.2"/>
      <circle cx="31.2" cy="-18" r="1.2"/>
      <circle cx="36" cy="0" r="1.2"/>
      <circle cx="31.2" cy="18" r="1.2"/>
      <circle cx="18" cy="31.2" r="1.2"/>
      <circle cx="0" cy="36" r="1.2"/>
      <circle cx="-18" cy="31.2" r="1.2"/>
      <circle cx="-31.2" cy="18" r="1.2"/>
      <circle cx="-36" cy="0" r="1.2"/>
      <circle cx="-31.2" cy="-18" r="1.2"/>
      <circle cx="-18" cy="-31.2" r="1.2"/>
