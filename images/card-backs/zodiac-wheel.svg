<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="zwg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#241644"/>
      <stop offset="1" stop-color="#0a0518"/>
    </radialGradient>
  </defs>
  <rect width="100" height="160" fill="url(#zwg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#e8c560" stroke-width="0.6"/>

  <!-- 황도 12궁 휠 — 동심원 -->
  <g transform="translate(50, 80)" stroke="#e8c560" fill="none">
    <circle r="34" stroke-width="0.6"/>
    <circle r="28" stroke-width="0.5" opacity="0.7"/>
    <circle r="20" stroke-width="0.5" opacity="0.6"/>
    <circle r="12" stroke-width="0.6"/>
    <circle r="4" fill="#e8c560" stroke="none"/>
    <!-- 12 분할선 -->
    <g opacity="0.5" stroke-width="0.3">
      <line x1="0" y1="-34" x2="0" y2="-12"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(30)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(60)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(90)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(120)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(150)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(180)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(210)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(240)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(270)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(300)"/>
      <line x1="0" y1="-34" x2="0" y2="-12" transform="rotate(330)"/>
    </g>
  </g>

  <!-- 12궁 점 — 외곽 원 위 -->
  <g transform="translate(50, 80)" fill="#e8c560">
    <g><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(30)"><circle cx="0" cy="-31" r="1.4"/></g>
    <g transform="rotate(60)"><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(90)"><circle cx="0" cy="-31" r="1.4"/></g>
    <g transform="rotate(120)"><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(150)"><circle cx="0" cy="-31" r="1.4"/></g>
    <g transform="rotate(180)"><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(210)"><circle cx="0" cy="-31" r="1.4"/></g>
    <g transform="rotate(240)"><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(270)"><circle cx="0" cy="-31" r="1.4"/></g>
    <g transform="rotate(300)"><circle cx="0" cy="-31" r="1.6"/></g>
    <g transform="rotate(330)"><circle cx="0" cy="-31" r="1.4"/></g>
  </g>

  <!-- 별자리 별 — 외곽 -->
  <g fill="#e8c560" opacity="0.7">
    <circle cx="20" cy="22" r="0.8"/>
    <circle cx="76" cy="28" r="0.6"/>
    <circle cx="14" cy="60" r="0.6"/>
    <circle cx="86" cy="100" r="0.7"/>
    <circle cx="22" cy="130" r="0.6"/>
    <circle cx="78" cy="138" r="0.5"/>
  </g>

  <!-- 중앙 별 -->
  <g transform="translate(50, 80)" fill="#e8c560">
    <path d="M0 -3 L0.7 -0.8 L3 -0.8 L1.1 0.5 L1.8 2.8 L0 1.4 L-1.8 2.8 L-1.1 0.5 L-3 -0.8 L-0.7 -0.8 Z"/>
  </g>
</svg>
