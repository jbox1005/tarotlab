<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="mcg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#070a14"/>
    </radialGradient>
    <clipPath id="mclip"><circle cx="0" cy="0" r="6"/></clipPath>
  </defs>
  <rect width="100" height="160" fill="url(#mcg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#d8e4f4" stroke-width="0.5" opacity="0.6"/>

  <!-- 8단계 달의 위상 — 원형 배치 -->
  <g transform="translate(50, 80)">
    <!-- 외곽 원 -->
    <circle r="34" fill="none" stroke="#d8e4f4" stroke-width="0.4" opacity="0.4"/>

    <!-- 신월 (12시) -->
    <g transform="translate(0,-30)">
      <circle r="6" fill="none" stroke="#d8e4f4" stroke-width="0.6"/>
    </g>
    <!-- 초승달 (1시 30분) -->
    <g transform="rotate(45) translate(0,-30) rotate(-45)">
      <circle r="6" fill="#d8e4f4" opacity="0.95"/>
      <circle cx="2.4" cy="0" r="6" fill="#1a2030"/>
    </g>
    <!-- 상현달 (3시) -->
    <g transform="rotate(90) translate(0,-30) rotate(-90)">
      <circle r="6" fill="#d8e4f4" opacity="0.95"/>
      <rect x="0" y="-6" width="6" height="12" fill="#1a2030"/>
    </g>
    <!-- 보름 직전 (4시 30분) -->
    <g transform="rotate(135) translate(0,-30) rotate(-135)">
      <circle r="6" fill="#d8e4f4"/>
      <ellipse cx="3.2" cy="0" rx="3" ry="6" fill="#1a2030"/>
    </g>
    <!-- 보름달 (6시) -->
    <g transform="rotate(180) translate(0,-30) rotate(-180)">
      <circle r="6" fill="#d8e4f4"/>
      <circle cx="-1.5" cy="-1.5" r="0.8" fill="#1a2030" opacity="0.4"/>
      <circle cx="2" cy="2" r="0.6" fill="#1a2030" opacity="0.35"/>
    </g>
    <!-- 보름 직후 (7시 30분) -->
    <g transform="rotate(225) translate(0,-30) rotate(-225)">
      <circle r="6" fill="#d8e4f4"/>
      <ellipse cx="-3.2" cy="0" rx="3" ry="6" fill="#1a2030"/>
    </g>
    <!-- 하현달 (9시) -->
    <g transform="rotate(270) translate(0,-30) rotate(-270)">
      <circle r="6" fill="#d8e4f4" opacity="0.95"/>
      <rect x="-6" y="-6" width="6" height="12" fill="#1a2030"/>
    </g>
    <!-- 그믐 직전 (10시 30분) -->
    <g transform="rotate(315) translate(0,-30) rotate(-315)">
      <circle r="6" fill="#d8e4f4" opacity="0.95"/>
      <circle cx="-2.4" cy="0" r="6" fill="#1a2030"/>
    </g>

    <!-- 중앙 큰 보름달 -->
    <circle r="14" fill="#d8e4f4"/>
    <circle cx="-3" cy="-3" r="1.6" fill="#1a2030" opacity="0.35"/>
    <circle cx="4" cy="2" r="1.2" fill="#1a2030" opacity="0.3"/>
    <circle cx="-1" cy="5" r="1" fill="#1a2030" opacity="0.3"/>
  </g>

  <!-- 별 -->
  <g fill="#d8e4f4" opacity="0.7">
    <circle cx="18" cy="24" r="0.6"/>
    <circle cx="82" cy="22" r="0.7"/>
    <circle cx="14" cy="76" r="0.5"/>
    <circle cx="86" cy="84" r="0.5"/>
    <circle cx="22" cy="138" r="0.6"/>
    <circle cx="78" cy="134" r="0.5"/>
  </g>
</svg>
