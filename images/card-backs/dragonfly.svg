<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dfly-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0a1c22"/>
      <stop offset="1" stop-color="#02080c"/>
    </linearGradient>
    <radialGradient id="dfly-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8d8d4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a8d8d4" stop-opacity="0"/>
    </radialGradient>
    <!-- 날개 베인(투명한 막) 그라디언트 -->
    <radialGradient id="dfly-wing" cx="20%" cy="50%" r="80%">
      <stop offset="0" stop-color="#a8d8d4" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#a8d8d4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a8d8d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="160" fill="url(#dfly-bg)"/>
  <rect x="4" y="4" width="92" height="152" rx="4" fill="none" stroke="#a8d8d4" stroke-width="0.8"/>
  <rect x="7" y="7" width="86" height="146" rx="3" fill="none" stroke="#a8d8d4" stroke-width="0.3" opacity="0.5"/>
  <circle cx="50" cy="80" r="34" fill="url(#dfly-glow)"/>

  <!-- ===== 잠자리 ===== -->
  <g stroke="#a8d8d4" stroke-width="0.6" fill="none" stroke-linecap="round">

    <!-- 위 좌측 날개 -->
    <g transform="translate(50 76)">
      <!-- 막 -->
      <path d="M 0 0 Q -8 -10 -22 -12 Q -32 -10 -34 -4 Q -32 0 -22 0 Q -10 -2 0 0 Z"
            fill="url(#dfly-wing)" stroke-width="0.8"/>
      <!-- 베인(맥) -->
      <g opacity="0.85" stroke-width="0.4">
        <path d="M -2 -1 Q -12 -6 -22 -8"/>
        <path d="M -2 -1 Q -14 -3 -28 -5"/>
        <path d="M -2 -1 Q -14 0 -28 -1"/>
        <path d="M -2 -1 Q -10 -8 -16 -10"/>
      </g>
    </g>

    <!-- 위 우측 날개 -->
    <g transform="translate(50 76)">
      <path d="M 0 0 Q 8 -10 22 -12 Q 32 -10 34 -4 Q 32 0 22 0 Q 10 -2 0 0 Z"
            fill="url(#dfly-wing)" stroke-width="0.8"/>
      <g opacity="0.85" stroke-width="0.4">
        <path d="M 2 -1 Q 12 -6 22 -8"/>
        <path d="M 2 -1 Q 14 -3 28 -5"/>
        <path d="M 2 -1 Q 14 0 28 -1"/>
        <path d="M 2 -1 Q 10 -8 16 -10"/>
      </g>
    </g>

    <!-- 아래 좌측 날개 (조금 작게) -->
    <g transform="translate(50 86)">
      <path d="M 0 0 Q -8 8 -20 10 Q -28 8 -30 4 Q -28 0 -20 0 Q -10 1 0 0 Z"
            fill="url(#dfly-wing)" stroke-width="0.8"/>
      <g opacity="0.85" stroke-width="0.4">
        <path d="M -2 1 Q -10 5 -20 7"/>
        <path d="M -2 1 Q -12 2 -24 4"/>
        <path d="M -2 1 Q -10 -1 -22 0"/>
      </g>
    </g>

    <!-- 아래 우측 날개 -->
    <g transform="translate(50 86)">
      <path d="M 0 0 Q 8 8 20 10 Q 28 8 30 4 Q 28 0 20 0 Q 10 1 0 0 Z"
            fill="url(#dfly-wing)" stroke-width="0.8"/>
      <g opacity="0.85" stroke-width="0.4">
        <path d="M 2 1 Q 10 5 20 7"/>
        <path d="M 2 1 Q 12 2 24 4"/>
        <path d="M 2 1 Q 10 -1 22 0"/>
      </g>
    </g>

    <!-- 머리 -->
    <g transform="translate(50 60)">
      <ellipse cx="0" cy="0" rx="3" ry="3.4" stroke-width="0.7"/>
      <!-- 두 눈 -->
      <circle cx="-1.6" cy="-0.8" r="1" fill="#a8d8d4" stroke="none"/>
      <circle cx="1.6" cy="-0.8" r="1" fill="#a8d8d4" stroke="none"/>
      <!-- 더듬이 -->
      <path d="M -1 -3 Q -2 -6 -3 -7"/>
      <path d="M 1 -3 Q 2 -6 3 -7"/>
    </g>

    <!-- 가슴 (날개가 붙는 부분) -->
    <g transform="translate(50 70)">
      <path d="M -3 -3 Q -3 4 0 6 Q 3 4 3 -3 Q 0 -5 -3 -3 Z" stroke-width="0.7"/>
    </g>

    <!-- 가늘고 긴 몸통 (꼬리) -->
    <g transform="translate(50 76)" stroke-width="0.7">
      <line x1="0" y1="0" x2="0" y2="40"/>
      <!-- 마디 -->
      <line x1="-1.4" y1="6" x2="1.4" y2="6" stroke-width="0.5"/>
      <line x1="-1.4" y1="14" x2="1.4" y2="14" stroke-width="0.5"/>
      <line x1="-1.2" y1="22" x2="1.2" y2="22" stroke-width="0.5"/>
      <line x1="-1" y1="30" x2="1" y2="30" stroke-width="0.5"/>
      <line x1="-0.8" y1="36" x2="0.8" y2="36" stroke-width="0.5"/>
      <!-- 꼬리 끝 -->
      <path d="M -1.5 38 Q 0 42 1.5 38"/>
    </g>

    <!-- 위쪽 별 -->
    <g transform="translate(50 36)" fill="#a8d8d4" stroke="none">
      <path d="M 0 -3 L 0.7 -0.7 L 3 0 L 0.7 0.7 L 0 3 L -0.7 0.7 L -3 0 L -0.7 -0.7 Z"/>
    </g>
    <!-- 보조 점 -->
    <g fill="#a8d8d4" stroke="none" opacity="0.7">
      <circle cx="20" cy="50" r="0.5"/>
      <circle cx="80" cy="50" r="0.5"/>
      <circle cx="22" cy="120" r="0.5"/>
      <circle cx="78" cy="120" r="0.5"/>
    </g>
  </g>
</svg>
